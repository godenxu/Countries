float vn(vec3 p){
  vec3 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(h3(i), h3(i+vec3(1,0,0)), f.x), mix(h3(i+vec3(0,1,0)), h3(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(h3(i+vec3(0,0,1)), h3(i+vec3(1,0,1)), f.x), mix(h3(i+vec3(0,1,1)), h3(i+vec3(1,1,1)), f.x), f.y), f.z);
}
vec3 layer(vec3 d, float dens, float thr, float sz, float flare){
  vec3 p = d*dens;
  vec3 id = floor(p), f = fract(p);
  float r = h3(id);
  if (r < thr) return vec3(0.0);
  vec3 off = vec3(h3(id+1.3), h3(id+2.7), h3(id+3.1))*0.7 + 0.15;
  float dd = length(f - off);
  float tw = 0.55 + 0.45*sin(uTime*1.7 + r*97.0);
  float core = smoothstep(sz, 0.0, dd) * ((r-thr)/(1.0-thr)) * tw;
  // faint cross flare on the brightest stars
  float fl = flare * smoothstep(0.985, 1.0, r) * exp(-dd*7.0) * tw;
  vec3 tint = mix(vec3(0.72, 0.84, 1.0), vec3(1.0, 0.88, 0.72), h3(id+9.1));
  return tint*(core + fl);
}
void main(){
  vec2 ndc = vUV*2.0-1.0;
  vec3 d = normalize(uFwd + uRight*ndc.x*uTanHalf*uAspect + uUp*ndc.y*uTanHalf);
  vec3 s = layer(d, 130.0, 0.90, 0.16, 0.6)*1.25 + layer(d, 340.0, 0.945, 0.10, 0.0)*0.85;
  // drifting nebula
  float neb = vn(d*3.1 + vec3(uTime*0.004)) * vn(d*7.3);
  vec3 nc = mix(vec3(0.05, 0.10, 0.24), vec3(0.16, 0.07, 0.24), vn(d*2.0));
  float haze = pow(max(0.0, 1.0 - abs(d.y*1.6 + d.x*0.35)), 3.0);
  vec3 c = s;
  c += nc*neb*0.55;
  c += vec3(0.06, 0.11, 0.21)*haze*0.75;
  c += vec3(0.013, 0.021, 0.038);
  o = vec4(c, 1.0);
}`;

const VS_ATMO = `#version 300 es
precision highp float;
in vec2 aLL;
uniform mat4 uVP;
uniform float uR;
out vec3 vN;
void main(){
  float lo = radians(aLL.x), la = radians(aLL.y);
  float c = cos(la);
  vN = vec3(c*sin(lo), sin(la), c*cos(lo));
  gl_Position = uVP*vec4(vN*uR, 1.0);
}`;

const FS_ATMO = `#version 300 es
precision highp float;
uniform vec3 uEye, uSun;
uniform float uFade, uR, uPow, uGain;
in vec3 vN;
out vec4 o;
void main(){
  vec3 n = normalize(vN);
  vec3 v = normalize(uEye - n*uR);
  float f = pow(clamp(1.0 - abs(dot(n, v)), 0.0, 1.0), uPow);
  float ndl = dot(n, uSun);
  float day = smoothstep(-0.42, 0.36, ndl);
  vec3 c = mix(vec3(0.05, 0.13, 0.34), vec3(0.34, 0.66, 1.0), day);
  // sunset ring right at the terminator
  float dusk = exp(-abs(ndl)*7.0);
  c = mix(c, vec3(1.0, 0.52, 0.26), dusk*0.75);
  o = vec4(c*f*uFade*uGain, 1.0);
}`;

const FS_PICK = `#version 300 es
precision highp float;
flat in float vCid;
in vec3 vN; in vec2 vLL; in vec3 vWorld;
out vec4 o;
void main(){
  int id = int(vCid + 0.5) + 1;
  o = vec4(float(id & 255)/255.0, float((id >> 8) & 255)/255.0, 0.0, 1.0);
}`;

const FS_BRIGHT = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform float uThresh;
in vec2 vUV; out vec4 o;
void main(){
  vec3 c = texture(uTex, vUV).rgb;
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  o = vec4(c*smoothstep(uThresh, uThresh+0.30, l), 1.0);
}`;

const FS_BLUR = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uDir;
in vec2 vUV; out vec4 o;
void main(){
  vec3 s = texture(uTex, vUV).rgb*0.1964;
  s += (texture(uTex, vUV+uDir*1.4117).rgb + texture(uTex, vUV-uDir*1.4117).rgb)*0.2969;
  s += (texture(uTex, vUV+uDir*3.2941).rgb + texture(uTex, vUV-uDir*3.2941).rgb)*0.0944;
  s += (texture(uTex, vUV+uDir*5.1764).rgb + texture(uTex, vUV-uDir*5.1764).rgb)*0.0104;
  o = vec4(s, 1.0);
}`;

const FS_COMP = `#version 300 es
precision highp float;
uniform sampler2D uScene, uB1, uB2, uB3;
uniform float uTime, uBloomAmt, uAber, uGrain, uScan, uFlash;
uniform vec2 uRes;
in vec2 vUV; out vec4 o;
void main(){
  vec2 q = vUV - 0.5;
  float r2 = dot(q, q);
  // subtle barrel distortion + chromatic aberration toward the edges
  vec2 uv = vUV + q*r2*0.028;
  vec2 ab = q*r2*uAber;
  vec3 c;
  c.r = texture(uScene, uv + ab).r;
  c.g = texture(uScene, uv).g;
  c.b = texture(uScene, uv - ab).b;
  vec3 bloom = texture(uB1, uv).rgb*0.5 + texture(uB2, uv).rgb*0.32 + texture(uB3, uv).rgb*0.24;
  c += bloom*uBloomAmt;
  c += vec3(0.35, 0.85, 0.95)*uFlash;
  c = pow(max(c, 0.0), vec3(0.94));
  c *= 1.0 - r2*0.62;
  float scan = sin(uv.y*uRes.y*1.6 + uTime*2.0)*0.5+0.5;
  c *= 1.0 - scan*uScan;
  float g = fract(sin(dot(uv*uRes + uTime, vec2(12.9898, 78.233)))*43758.5453);
  c += (g-0.5)*uGrain;
  o = vec4(c, 1.0);
}`;

/* ---------------- palettes ---------------- */
const REGION_COLOR = {
  Asia: [0.176, 0.290, 0.247], Europe: [0.157, 0.259, 0.310],
  Africa: [0.294, 0.259, 0.184], Americas: [0.157, 0.282, 0.278],
  Oceania: [0.196, 0.278, 0.231], Antarctic: [0.227, 0.278, 0.325], '': [0.20, 0.25, 0.27],
};

// alpha channel carries normalised log population density -> night-light intensity
function densityAlpha(rec) {
  const d = rec && rec.dens;
  if (!d || d <= 0) return 20;
  const t = clamp((Math.log10(d) + 0.5) / 3.2, 0, 1);
  return Math.round(20 + t * 235);
}

function buildPalette(meta, countries) {
  const px = new Uint8Array(256 * 4);
  for (let i = 0; i < meta.length && i < 256; i++) {
    const rec = countries[i];
    const base = REGION_COLOR[(rec && rec.reg.en) || ''] || REGION_COLOR[''];
    let h = 0; const k = meta[i].key;
    for (let c = 0; c < k.length; c++) h = (h * 31 + k.charCodeAt(c)) & 0xffff;
    const j = ((h % 100) / 100 - 0.5) * 0.20;
    const warm = ((h >> 4) % 100) / 100 * 0.06 - 0.03;
    px[i * 4 + 0] = clamp((base[0] * (1 + j) + warm) * 255, 8, 250);
    px[i * 4 + 1] = clamp((base[1] * (1 + j)) * 255, 8, 250);
    px[i * 4 + 2] = clamp((base[2] * (1 + j) - warm * 0.5) * 255, 8, 250);
    px[i * 4 + 3] = densityAlpha(rec);
  }
  return px;
}

/* sequential ramp for the thematic layer: deep teal -> aurora -> gold -> coral */
const RAMP = [
  [0.055, 0.145, 0.200], [0.075, 0.310, 0.330], [0.114, 0.510, 0.451],
  [0.275, 0.780, 0.596], [0.784, 0.816, 0.400], [0.949, 0.663, 0.278], [0.980, 0.404, 0.322],
];
function rampColor(t) {
  t = clamp(t, 0, 1) * (RAMP.length - 1);
  const i = Math.min(RAMP.length - 2, Math.floor(t)), f = t - i;
  return [lerp(RAMP[i][0], RAMP[i + 1][0], f), lerp(RAMP[i][1], RAMP[i + 1][1], f), lerp(RAMP[i][2], RAMP[i + 1][2], f)];
}

function buildThemePalette(meta, countries, key, scaleFn) {
  const px = new Uint8Array(256 * 4);
  for (let i = 0; i < meta.length && i < 256; i++) {
    const rec = countries[i];
    const v = key && rec ? scaleFn(rec) : null;
    let col;
    if (v == null) col = [0.098, 0.129, 0.153];
    else col = rampColor(v);
    px[i * 4 + 0] = clamp(col[0] * 255, 0, 255);
    px[i * 4 + 1] = clamp(col[1] * 255, 0, 255);
    px[i * 4 + 2] = clamp(col[2] * 255, 0, 255);
    px[i * 4 + 3] = densityAlpha(rec);
  }
  return px;
}

/* ---------------- sun position ---------------- */
function sunDirection(date) {
  const d = date || new Date();
  const start = Date.UTC(d.getUTCFullYear(), 0, 0);
  const dayOfYear = (d.getTime() - start) / 86400000;
  const g = (357.529 + 0.98560028 * (dayOfYear + 0.5)) * DEG;
  const decl = -23.44 * Math.cos((360 / 365.24 * (dayOfYear + 10)) * DEG) * DEG;
  const eot = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g)
    - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const utcMin = d.getUTCHours() * 60 + d.getUTCMinutes() + d.getUTCSeconds() / 60;
  const lon = -((utcMin + eot) / 4 - 180);
  const la = decl, lo = ((lon + 540) % 360 - 180) * DEG;
  return [Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)];
}

/* ============================================================
   surface labels — a glyph atlas drawn as tangent-plane quads so
   names sit ON the map and rotate/foreshorten with it. Countries
   and their top cities share one atlas; a tier flag tells the
   shader how big/bright to draw each instance.
   ============================================================ */
const ATLAS_W = 2048, ATLAS_H = 2048, ATLAS_FONT = 34, CITY_FONT = 27, ATLAS_ROW = 48, CITY_ROW = 38;

// system-only font stack, changeable from Settings — no webfont fetches
let LABEL_FONT_STACK = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif';

function buildLabelAtlas(countries, meta, lang) {
  const cv = document.createElement('canvas');
  cv.width = ATLAS_W; cv.height = ATLAS_H;
  const g = cv.getContext('2d', { willReadFrequently: false });
  g.clearRect(0, 0, ATLAS_W, ATLAS_H);
  g.textBaseline = 'middle';
  g.textAlign = 'left';
  g.lineJoin = 'round';

  const draw = (name, x, y, row, halo, fill) => {
    g.strokeStyle = halo; g.lineWidth = row > 40 ? 5 : 3.6;
    g.strokeText(name, x + 7, y + row / 2);
    g.fillStyle = fill;
    g.fillText(name, x + 7, y + row / 2);
  };

  const rects = new Array(countries.length);
  g.font = `600 ${ATLAS_FONT}px ${LABEL_FONT_STACK}`;
  let x = 4, y = 4;
  for (let i = 0; i < countries.length; i++) {
    const name = lang === 'zh' ? countries[i].zh : countries[i].en;
    const w = Math.ceil(g.measureText(name).width) + 14;
    if (x + w > ATLAS_W - 4) { x = 4; y += ATLAS_ROW; }
    if (y + ATLAS_ROW > ATLAS_H) break;
    // deep aurora-navy halo keeps names legible over any choropleth colour,
    // and a soft mint fill keeps them part of the same HUD family as the UI
    draw(name, x, y, ATLAS_ROW, 'rgba(4,13,17,0.94)', '#d6f4ec');
    rects[i] = [x / ATLAS_W, y / ATLAS_H, w / ATLAS_W, ATLAS_ROW / ATLAS_H, w / ATLAS_ROW];
    x += w + 7;
  }

  // city names pack into whatever atlas rows remain. A solid pill behind the
  // text (not just a stroke halo) guarantees contrast even sitting on top of
  // a bright selected-country or choropleth fill.
  const cityRects = [];
  g.font = `500 ${CITY_FONT}px ${LABEL_FONT_STACK}`;
  y += ATLAS_ROW;
  x = 4;
  const cities = [];
  for (let i = 0; i < countries.length; i++) {
    for (const c of countries[i].cities || []) cities.push({ ...c, ci: i });
  }
  const PAD = 9, DOT = 8;
  for (const c of cities) {
    const name = lang === 'zh' ? c.zh : c.en;
    const textW = Math.ceil(g.measureText(name).width);
    const w = DOT + 5 + textW + PAD * 2;
    if (x + w > ATLAS_W - 4) { x = 4; y += CITY_ROW; }
    if (y + CITY_ROW > ATLAS_H) break;
    const cy = y + CITY_ROW / 2;
    g.fillStyle = 'rgba(4,13,18,0.72)';
    g.beginPath();
    if (g.roundRect) g.roundRect(x, y + 3, w, CITY_ROW - 6, (CITY_ROW - 6) / 2);
    else g.rect(x, y + 3, w, CITY_ROW - 6);
    g.fill();
    g.fillStyle = '#5fe0c4';
    g.beginPath(); g.arc(x + PAD + DOT / 2, cy, DOT / 2, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(3,11,15,0.96)'; g.lineWidth = 3.2;
    g.strokeText(name, x + PAD + DOT + 5, cy);
    g.fillStyle = '#eafff8';
    g.fillText(name, x + PAD + DOT + 5, cy);
    cityRects.push({ rect: [x / ATLAS_W, y / ATLAS_H, w / ATLAS_W, CITY_ROW / ATLAS_H, w / CITY_ROW], c });
    x += w + 6;
  }

  return { canvas: cv, rects, cityRects };
}

function buildLabelInstances(countries, meta, atlas) {
  const nCountry = meta.length, nCity = atlas.cityRects.length;
  const n = nCountry + nCity;
  const ll = new Float32Array(n * 2);
  const uv = new Float32Array(n * 4);
  const info = new Float32Array(n * 4);
  const tier = new Float32Array(n);
  let count = 0;
  // sort so the biggest countries draw last (they win overlaps)
  const order = meta.map((m, i) => i).sort((a, b) => meta[a].area - meta[b].area);
  for (const i of order) {
    const r = atlas.rects[i];
    if (!r) continue;
    const m = meta[i];
    if (!m.area) continue;
    ll[count * 2] = m.lon; ll[count * 2 + 1] = m.lat;
    uv[count * 4] = r[0]; uv[count * 4 + 1] = r[1]; uv[count * 4 + 2] = r[2]; uv[count * 4 + 3] = r[3];
    // bigger states carry slightly bigger type, as on a printed map
    const s = clamp(0.78 + Math.log10(Math.max(1e4, m.area)) * 0.115, 0.78, 1.45);
    info[count * 4] = s; info[count * 4 + 1] = m.area; info[count * 4 + 2] = i; info[count * 4 + 3] = r[4];
    tier[count] = 0;
    count++;
  }
  // cities: fixed small on-screen size, only fade in once zoomed well past
  // their host country's own label threshold (encoded as a tiny synthetic area)
  for (const { rect: r, c } of atlas.cityRects) {
    ll[count * 2] = c.lon; ll[count * 2 + 1] = c.lat;
    uv[count * 4] = r[0]; uv[count * 4 + 1] = r[1]; uv[count * 4 + 2] = r[2]; uv[count * 4 + 3] = r[3];
    info[count * 4] = 0.95; info[count * 4 + 1] = 900; info[count * 4 + 2] = 10000 + c.ci; info[count * 4 + 3] = r[4];
    tier[count] = 1;
    count++;
  }
  return { ll, uv, info, tier, count };
}

/* ============================================================
   renderer + camera + pointer input
   ============================================================ */
const EE = { A1: 1.340264, A2: -0.081106, A3: 0.000893, A4: 0.003796, M: 0.866025404 };
function equalEarth(lon, lat) {
  const lo = lon * DEG, la = lat * DEG;
  const th = Math.asin(clamp(EE.M * Math.sin(la), -1, 1));
  const t2 = th * th, t6 = t2 * t2 * t2;
  const x = 3.464101615 * lo * Math.cos(th) / (3 * (9 * EE.A4 * t6 * t2 + 7 * EE.A3 * t6 + 3 * EE.A2 * t2 + EE.A1));
  const y = th * (EE.A1 + EE.A2 * t2 + EE.A3 * t6 + EE.A4 * t6 * t2);
  return [x, y];
}
function equalEarthInv(x, y) {
  let th = y;
  for (let i = 0; i < 14; i++) {
    const t2 = th * th, t6 = t2 * t2 * t2;
    const f = th * (EE.A1 + EE.A2 * t2 + EE.A3 * t6 + EE.A4 * t6 * t2) - y;
    const fp = EE.A1 + 3 * EE.A2 * t2 + 7 * EE.A3 * t6 + 9 * EE.A4 * t6 * t2;
    const d = f / fp; th -= d;
    if (Math.abs(d) < 1e-10) break;
  }
  const s = Math.sin(th) / EE.M;
  if (Math.abs(s) > 1) return null;
  const lat = Math.asin(s) / DEG;
  const t2 = th * th, t6 = t2 * t2 * t2;
  const lon = x * 3 * (9 * EE.A4 * t6 * t2 + 7 * EE.A3 * t6 + 3 * EE.A2 * t2 + EE.A1) / (3.464101615 * Math.cos(th)) / DEG;
  if (Math.abs(lon) > 181) return null;
  return [lon, lat];
}
const v3 = {
  fromLL: (lon, lat) => { const a = lon * DEG, b = lat * DEG, c = Math.cos(b); return [c * Math.sin(a), Math.sin(b), c * Math.cos(a)]; },
  toLL: (v) => [Math.atan2(v[0], v[2]) / DEG, Math.asin(clamp(v[1], -1, 1)) / DEG],
  slerp: (a, b, t) => {
    let d = clamp(a[0] * b[0] + a[1] * b[1] + a[2] * b[2], -1, 1);
    const o = Math.acos(d);
    if (o < 1e-5) return a.slice();
    const s = Math.sin(o), w1 = Math.sin((1 - t) * o) / s, w2 = Math.sin(t * o) / s;
    return [a[0] * w1 + b[0] * w2, a[1] * w1 + b[1] * w2, a[2] * w1 + b[2] * w2];
  },
};

const PLANE_SCALE = 0.74;
const FOV = 42 * DEG;
const LABEL_PX = 13;
const MAX_DYN = 6000;

class View {
  constructor(canvas, mesh, countries) {
    this.canvas = canvas;
    this.mesh = mesh;
    this.countries = countries;
    this.cam = { lon: 105, lat: 22, dist: 3.15, morph: 0 };
    this.vel = { lon: 0, lat: 0 };
    this.spin = true;
    this.spinIdle = 0;
    this.hover = -1;
    this.sel = -1;
    this.time = 0;
    this.anim = null;
    this.shift = { x: 0, y: 0 };
    this.nearK = 1.35; this.farK = 3.0;
    this.fx = {
      bloom: 1.05, clouds: 0.55, aurora: 0.9, sweep: true, grain: 0.016,
      aber: 0.0022, scan: 0.012, labels: true, atmo: 1.0,
    };
    this.build = 0;          // boot reveal 0 -> 1
    this.selLift = 0;        // selected country rises off the surface
    this.palMix = 0;         // region palette -> theme palette
    this.palMixTo = 0;
    this.flash = 0;
    this.ripples = [];
    this.arcs = null;
    this.initGL();
    this.bindInput();
  }

  /* ---------------- GL setup ---------------- */
  initGL() {
    const gl = this.canvas.getContext('webgl2', {
      antialias: true, alpha: false, depth: true,
      powerPreference: 'high-performance', preserveDrawingBuffer: false,
    });
    if (!gl) throw new Error('WEBGL2_UNAVAILABLE');
    this.gl = gl;

    this.pLand = program(gl, VS_MESH, FS_LAND, 'land');
    this.pOcean = program(gl, VS_MESH, FS_OCEAN, 'ocean');
    this.pCloud = program(gl, VS_MESH, FS_CLOUD, 'cloud');
    this.pAurora = program(gl, VS_MESH, FS_AURORA, 'aurora');
    this.pPick = program(gl, VS_MESH, FS_PICK, 'pick');
    this.pLine = program(gl, VS_LINE, FS_LINE, 'line');
    this.pLabel = program(gl, VS_LABEL, FS_LABEL, 'label');
    this.pAtmo = program(gl, VS_ATMO, FS_ATMO, 'atmo');
    this.pStars = program(gl, VS_QUAD, FS_STARS, 'stars');
    this.pBright = program(gl, VS_QUAD, FS_BRIGHT, 'bright');
    this.pBlur = program(gl, VS_QUAD, FS_BLUR, 'blur');
    this.pComp = program(gl, VS_QUAD, FS_COMP, 'comp');

    const m = this.mesh;
    this.bFillPos = buffer(gl, m.fill.pos);
    this.bFillCid = buffer(gl, m.fill.cid);
    this.bFillIdx = buffer(gl, m.fill.idx, gl.ELEMENT_ARRAY_BUFFER);

    const STEP = 2;
    const cols = 360 / STEP + 1, rows = 180 / STEP + 1;
    const gp = new Float32Array(cols * rows * 2);
    const gi = new Uint32Array((cols - 1) * (rows - 1) * 6);
    let k = 0, q = 0;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { gp[k++] = -180 + c * STEP; gp[k++] = -90 + r * STEP; }
    for (let r = 0; r < rows - 1; r++) for (let c = 0; c < cols - 1; c++) {
      const a = r * cols + c, b = a + 1, d = a + cols, e = d + 1;
      gi[q++] = a; gi[q++] = d; gi[q++] = b; gi[q++] = b; gi[q++] = d; gi[q++] = e;
    }
    this.bGridPos = buffer(gl, gp);
    this.bGridIdx = buffer(gl, gi, gl.ELEMENT_ARRAY_BUFFER);
    this.gridCount = gi.length;

    this.bCorner = buffer(gl, new Float32Array([0, -1, 0, 1, 1, -1, 1, 1]));
    this.bQuad01 = buffer(gl, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]));
    this.lines = {};
    for (const [name, src] of [['seg', m.seg], ['grat', m.grat], ['dash', m.dash]]) {
      this.lines[name] = { a: buffer(gl, src.a), b: buffer(gl, src.b), meta: src.meta ? buffer(gl, src.meta) : null, n: src.n };
    }
    // dynamic geometry: arcs, target rings, click ripples
    this.dyn = {
      a: new Float32Array(MAX_DYN * 2), b: new Float32Array(MAX_DYN * 2), meta: new Float32Array(MAX_DYN * 3),
      ba: gl.createBuffer(), bb: gl.createBuffer(), bm: gl.createBuffer(), n: 0,
    };
    for (const [buf, arr] of [[this.dyn.ba, this.dyn.a], [this.dyn.bb, this.dyn.b], [this.dyn.bm, this.dyn.meta]]) {
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, arr.byteLength, gl.DYNAMIC_DRAW);
    }
    this.bQuad = this.bQuad01;

    this.palTexA = this.makeTex(gl, buildPalette(m.meta, this.countries));
    this.palTexB = this.makeTex(gl, buildPalette(m.meta, this.countries));
    this.setupLabels();

    this.fboScene = makeFBO(gl, 2, 2, true);
    this.blm = [];
    for (let i = 0; i < 3; i++) this.blm.push({ a: makeFBO(gl, 2, 2, false), b: makeFBO(gl, 2, 2, false) });
    this.fboPick = makeFBO(gl, 2, 2, true);
    this.pickBuf = new Uint8Array(4);
    this.resize();
  }

  makeTex(gl, px) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }

  setupLabels() {
    const gl = this.gl;
    const atlas = buildLabelAtlas(this.countries, this.mesh.meta, LANG);
    const inst = buildLabelInstances(this.countries, this.mesh.meta, atlas);
    if (!this.atlasTex) {
      this.atlasTex = gl.createTexture();
      this.lbBuf = { ll: gl.createBuffer(), uv: gl.createBuffer(), info: gl.createBuffer(), tier: gl.createBuffer() };
    }
    gl.bindTexture(gl.TEXTURE_2D, this.atlasTex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, atlas.canvas);
    // no mipmaps: neighbouring glyph cells would bleed into each other at coarse levels
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const upd = (buf, arr) => { gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW); };
    upd(this.lbBuf.ll, inst.ll); upd(this.lbBuf.uv, inst.uv); upd(this.lbBuf.info, inst.info);
    upd(this.lbBuf.tier, inst.tier);
    this.labelCount = inst.count;
    this.dirty = true;
  }

  setTheme(scaleFn) {
    const px = scaleFn
      ? buildThemePalette(this.mesh.meta, this.countries, true, scaleFn)
      : buildPalette(this.mesh.meta, this.countries);
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.palTexB);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, px);
    this.palMixTo = scaleFn ? 1 : 0;
    this.dirty = true;
  }

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(2, Math.round(this.canvas.clientWidth * dpr));
    const h = Math.max(2, Math.round(this.canvas.clientHeight * dpr));
    if (w === this.W && h === this.H) return;
    // a resize mid-flight (e.g. the on-screen keyboard opening/closing while a
    // search result is animating in) must never snap the camera — that reads
    // as a flash-cut. Only re-fit when the camera is idle.
    const settled = !this.anim && !this.morphAnim && !this.shiftAnim;
    const wasFit = settled && this.lastFit && Math.abs(this.cam.dist - this.lastFit) < this.lastFit * 0.06;
    this.W = w; this.H = h; this.dpr = dpr;
    this.canvas.width = w; this.canvas.height = h;
    this.fboScene.resize(w, h);
    for (let i = 0; i < 3; i++) {
      const s = 1 << (i + 1);
      this.blm[i].a.resize(Math.max(2, w / s | 0), Math.max(2, h / s | 0));
      this.blm[i].b.resize(Math.max(2, w / s | 0), Math.max(2, h / s | 0));
    }
    this.fboPick.resize(Math.max(2, w >> 1), Math.max(2, h >> 1));
    const f = this.fitDist();
    if (wasFit) this.cam.dist = f;
    this.lastFit = f;
    this.dirty = true;
  }

  /* ---------------- camera ---------------- */
  camVectors() {
    const c = this.cam;
    const n = v3.fromLL(c.lon, c.lat);
    const gEye = [n[0] * c.dist, n[1] * c.dist, n[2] * c.dist];
    const pp = equalEarth(c.lon, c.lat);
    const pTgt = [pp[0] * PLANE_SCALE, pp[1] * PLANE_SCALE, 0];
    const m = easeIO(clamp(c.morph, 0, 1));
    const eye = [lerp(gEye[0], pTgt[0], m), lerp(gEye[1], pTgt[1], m), lerp(gEye[2], c.dist, m)];
    const tgt = [lerp(0, pTgt[0], m), lerp(0, pTgt[1], m), 0];
    return { eye, tgt, up: [0, 1, 0] };
  }

  matrices() {
    const { eye, tgt, up } = this.camVectors();
    const aspect = this.W / this.H;
    const near = Math.max(0.02, this.cam.dist - this.nearK);
    const proj = M4.persp(FOV, aspect, near, this.cam.dist + this.farK);
    proj[8] = this.shift.x; proj[9] = this.shift.y;
    const view = M4.lookAt(eye, tgt, up);
    const vp = M4.mul(proj, view);
    let f = [tgt[0] - eye[0], tgt[1] - eye[1], tgt[2] - eye[2]];
    const fl = Math.hypot(f[0], f[1], f[2]) || 1; f = f.map((v) => v / fl);
    let r = [f[1] * up[2] - f[2] * up[1], f[2] * up[0] - f[0] * up[2], f[0] * up[1] - f[1] * up[0]];
    const rl = Math.hypot(r[0], r[1], r[2]) || 1; r = r.map((v) => v / rl);
    const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
    return { vp, eye, fwd: f, right: r, up: u, aspect };
  }

  screenToGeo(px, py) {
    const { eye, fwd, right, up, aspect } = this.matrices();
    const ndcx = (px / this.canvas.clientWidth) * 2 - 1 + this.shift.x;
    const ndcy = 1 - (py / this.canvas.clientHeight) * 2 + this.shift.y;
    const th = Math.tan(FOV / 2);
    const d = [
      fwd[0] + right[0] * ndcx * th * aspect + up[0] * ndcy * th,
      fwd[1] + right[1] * ndcx * th * aspect + up[1] * ndcy * th,
      fwd[2] + right[2] * ndcx * th * aspect + up[2] * ndcy * th,
    ];
    const dl = Math.hypot(d[0], d[1], d[2]); d[0] /= dl; d[1] /= dl; d[2] /= dl;
    if (this.cam.morph < 0.5) {
      const b = eye[0] * d[0] + eye[1] * d[1] + eye[2] * d[2];
      const cc = eye[0] * eye[0] + eye[1] * eye[1] + eye[2] * eye[2] - 1;
      const disc = b * b - cc;
      if (disc < 0) return null;
      const t = -b - Math.sqrt(disc);
      return v3.toLL([eye[0] + d[0] * t, eye[1] + d[1] * t, eye[2] + d[2] * t]);
    }
    if (Math.abs(d[2]) < 1e-6) return null;
    const t = -eye[2] / d[2];
    if (t < 0) return null;
    return equalEarthInv((eye[0] + d[0] * t) / PLANE_SCALE, (eye[1] + d[1] * t) / PLANE_SCALE);
  }

  worldPerPixel() { return 2 * this.cam.dist * Math.tan(FOV / 2) / this.canvas.clientHeight; }
  aspect() { return Math.max(0.2, this.canvas.clientWidth / Math.max(1, this.canvas.clientHeight)); }
  fitGlobe() { return 1.2 / (Math.tan(FOV / 2) * Math.min(this.aspect(), 1)); }
  fitPlane() { const t = Math.tan(FOV / 2), a = this.aspect(); return Math.max(2.08 / (t * a), 1.12 / t); }
  fitDist() { return this.cam.morph > 0.5 ? this.fitPlane() : this.fitGlobe(); }

  // Distance that frames one country's full extent inside the *visible* map
  // area (visW/visH exclude whatever the detail panel currently covers), so
  // every country lands at a consistent, panel-safe zoom regardless of shape.
  fitCountryDist(rRad, visW, visH) {
    const t = Math.tan(FOV / 2);
    const visAspect = Math.max(0.15, visW / Math.max(1, visH));
    const k = Math.min(visAspect, 1);
    const margin = 1.55;
    if (this.cam.morph > 0.5) {
      const lin = rRad * PLANE_SCALE * 1.18 * margin;
      return clamp(lin / (t * k), 0.24, this.fitPlane() * 1.05);
    }
    const lin = Math.sin(Math.min(rRad, 1.4)) * margin;
    const d = 1 + lin / (t * k);
    return clamp(d, 1.06, this.fitGlobe() * 1.05);
  }

  flyTo(lon, lat, dist, ms) {
    const c = this.cam;
    const dl = ((lon - c.lon + 540) % 360) - 180;
    this.anim = { t0: performance.now(), ms: ms || 900, from: { lon: c.lon, lat: c.lat, dist: c.dist }, dl,
      to: { lat, dist: dist != null ? dist : c.dist } };
    this.spinIdle = performance.now() + 6000;
    this.dirty = true;
  }

  setMorph(target) {
    const before = this.fitDist();
    this.morphAnim = { t0: performance.now(), ms: 1250, from: this.cam.morph, to: target };
    const wasMap = this.cam.morph > 0.5;
    if (wasMap !== (target > 0.5)) {
      const after = target > 0.5 ? this.fitPlane() : this.fitGlobe();
      this.cam.dist = clamp(this.cam.dist * (after / before), target > 0.5 ? 0.24 : 1.16, after * 1.35);
    }
    this.dirty = true;
  }

  setShift(x, y) {
    if (Math.abs(x - this.shift.x) < 1e-4 && Math.abs(y - this.shift.y) < 1e-4) return;
    this.shiftAnim = { t0: performance.now(), ms: 380, fx: this.shift.x, fy: this.shift.y, tx: x, ty: y };
    this.dirty = true;
  }

  /* ---------------- input ---------------- */
  bindInput() {
    const cv = this.canvas;
    const pts = new Map();
    let last = null, pinch = null, moved = 0, downT = 0, downPos = null;
    const onDown = (e) => {
      cv.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 1) {
        last = { x: e.clientX, y: e.clientY, t: performance.now() };
        downPos = { x: e.clientX, y: e.clientY }; downT = performance.now(); moved = 0;
        this.vel.lon = this.vel.lat = 0;
        cv.classList.add('dragging');
      } else if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), dist: this.cam.dist };
      }
      this.spinIdle = performance.now() + 4000;
    };
    const onMove = (e) => {
      const rect = cv.getBoundingClientRect();
      if (!pts.has(e.pointerId)) { this.onHover && this.onHover(e.clientX - rect.left, e.clientY - rect.top); return; }
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size >= 2 && pinch) {
        const [a, b] = [...pts.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d > 5) this.zoomTo(pinch.dist * (pinch.d / d), (a.x + b.x) / 2 - rect.left, (a.y + b.y) / 2 - rect.top, true);
        return;
      }
      if (!last) return;
      const dx = e.clientX - last.x, dy = e.clientY - last.y;
      moved += Math.abs(dx) + Math.abs(dy);
      last = { x: e.clientX, y: e.clientY, t: performance.now() };
      this.drag(dx, dy);
      this.spinIdle = performance.now() + 4000;
    };
    const onUp = () => {
      pts.clear(); pinch = null;
      cv.classList.remove('dragging');
      last = null;
      const rect = cv.getBoundingClientRect();
      if (moved < 8 && performance.now() - downT < 500 && downPos) {
        this.onClick && this.onClick(downPos.x - rect.left, downPos.y - rect.top);
      }
      this.spinIdle = performance.now() + 5000;
    };
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp);
    cv.addEventListener('pointercancel', onUp);
    cv.addEventListener('pointerleave', () => { this.hover = -1; this.onHoverOut && this.onHoverOut(); this.dirty = true; });
    cv.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = cv.getBoundingClientRect();
      const k = Math.exp(clamp(e.deltaY, -120, 120) * 0.0016);
      this.zoomTo(this.cam.dist * k, e.clientX - rect.left, e.clientY - rect.top, true);
      this.spinIdle = performance.now() + 4000;
    }, { passive: false });
    cv.addEventListener('dblclick', (e) => {
      const rect = cv.getBoundingClientRect();
      this.zoomTo(this.cam.dist * 0.62, e.clientX - rect.left, e.clientY - rect.top, true);
    });
  }

  drag(dx, dy) {
    const c = this.cam;
    if (c.morph > 0.5) {
      const wpp = this.worldPerPixel();
      const pp = equalEarth(c.lon, c.lat);
      const g = equalEarthInv(pp[0] - dx * wpp / PLANE_SCALE, clamp(pp[1] + dy * wpp / PLANE_SCALE, -1.32, 1.32));
      if (g) { c.lon = g[0]; c.lat = clamp(g[1], -88, 88); }
    } else {
      const wpp = this.worldPerPixel() / DEG;
      const cosl = Math.max(0.28, Math.cos(c.lat * DEG));
      const dlon = -dx * wpp / cosl, dlat = dy * wpp;
      c.lon += dlon; c.lat = clamp(c.lat + dlat, -89, 89);
      this.vel.lon = dlon; this.vel.lat = dlat;
    }
    c.lon = ((c.lon + 540) % 360) - 180;
    this.dirty = true;
  }

  zoomTo(newDist, px, py, keepPoint) {
    const c = this.cam;
    const before = keepPoint ? this.screenToGeo(px, py) : null;
    c.dist = clamp(newDist, c.morph > 0.5 ? 0.24 : 1.16, this.fitDist() * 1.35);
    if (before) {
      const after = this.screenToGeo(px, py);
      if (after) {
        const dl = ((before[0] - after[0] + 540) % 360) - 180;
        c.lon = ((c.lon + dl + 540) % 360) - 180;
        c.lat = clamp(c.lat + (before[1] - after[1]), -89, 89);
      }
    }
    this.dirty = true;
  }

  addRipple(lon, lat) {
    this.ripples.push({ lon, lat, t0: performance.now() });
    if (this.ripples.length > 4) this.ripples.shift();
    this.flash = 0.09;
  }

  setArcs(fromIdx, toIdxs) {
    if (fromIdx < 0 || !toIdxs || !toIdxs.length) { this.arcs = null; return; }
    const M = this.mesh.meta, a = M[fromIdx];
    const segs = [];
    for (const j of toIdxs) {
      const b = M[j];
      if (!b) continue;
      const va = v3.fromLL(a.lon, a.lat), vb = v3.fromLL(b.lon, b.lat);
      const ang = Math.acos(clamp(va[0] * vb[0] + va[1] * vb[1] + va[2] * vb[2], -1, 1));
      const N = Math.max(10, Math.round(ang * 26));
      const hgt = 0.045 + ang * 0.16;
      let prev = null;
      for (let i = 0; i <= N; i++) {
        const t = i / N;
        const p = v3.toLL(v3.slerp(va, vb, t));
        const e = 0.006 + Math.sin(t * Math.PI) * hgt;
        if (prev && Math.abs(prev[0] - p[0]) < 180) segs.push([prev[0], prev[1], p[0], p[1], prev[2], e, t]);
        prev = [p[0], p[1], e];
      }
    }
    this.arcs = segs;
    this.dirty = true;
  }

  /* ---------------- picking ---------------- */
  pickAt(px, py) {
    const gl = this.gl;
    const x = Math.round(px * this.dpr * 0.5), y = Math.round((this.canvas.clientHeight - py) * this.dpr * 0.5);
    if (x < 0 || y < 0 || x >= this.fboPick.w || y >= this.fboPick.h) return -1;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fboPick.fb);
    gl.viewport(0, 0, this.fboPick.w, this.fboPick.h);
    gl.clearColor(0, 0, 0, 1);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    this.drawMesh(this.pPick, this.matrices(), 0.0016, true);
    gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, this.pickBuf);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const id = this.pickBuf[0] + (this.pickBuf[1] << 8) - 1;
    return id >= 0 && id < this.mesh.meta.length ? id : -1;
  }

  /* ---------------- drawing ---------------- */
  setCommon(p, M) {
    const gl = this.gl;
    gl.useProgram(p);
    gl.uniformMatrix4fv(p.u.uVP, false, M.vp);
    gl.uniform1f(p.u.uMorph, easeIO(clamp(this.cam.morph, 0, 1)));
    gl.uniform1f(p.u.uCenterLon, this.cam.lon);
    gl.uniform1f(p.u.uPlaneScale, PLANE_SCALE);
    gl.uniform3fv(p.u.uSun, this.sun);
    gl.uniform3fv(p.u.uEye, M.eye);
    gl.uniform1f(p.u.uTime, this.time);
    gl.uniform1f(p.u.uSel, this.sel);
    gl.uniform1f(p.u.uSelLift, this.selLift);
    gl.uniform1f(p.u.uBuild, this.build);
    gl.uniform1f(p.u.uSweep, this.sweep);
    gl.uniform1f(p.u.uNight, this.nightScale);
  }

  drawMesh(p, M, elev, isLand) {
    const gl = this.gl;
    this.setCommon(p, M);
    gl.uniform1f(p.u.uElev, elev);
    if (isLand) {
      gl.bindBuffer(gl.ARRAY_BUFFER, this.bFillPos);
      gl.enableVertexAttribArray(p.a.aLL);
      gl.vertexAttribPointer(p.a.aLL, 2, gl.FLOAT, false, 0, 0);
      gl.vertexAttribDivisor(p.a.aLL, 0);
      if (p.a.aCid >= 0) {
        gl.bindBuffer(gl.ARRAY_BUFFER, this.bFillCid);
        gl.enableVertexAttribArray(p.a.aCid);
        gl.vertexAttribPointer(p.a.aCid, 1, gl.UNSIGNED_SHORT, false, 0, 0);
        gl.vertexAttribDivisor(p.a.aCid, 0);
      }
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.bFillIdx);
      gl.drawElements(gl.TRIANGLES, this.mesh.fill.count, gl.UNSIGNED_INT, 0);
    } else {
      gl.bindBuffer(gl.ARRAY_BUFFER, this.bGridPos);
      gl.enableVertexAttribArray(p.a.aLL);
      gl.vertexAttribPointer(p.a.aLL, 2, gl.FLOAT, false, 0, 0);
      gl.vertexAttribDivisor(p.a.aLL, 0);
      if (p.a.aCid >= 0) { gl.disableVertexAttribArray(p.a.aCid); gl.vertexAttrib1f(p.a.aCid, 0); }
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.bGridIdx);
      gl.drawElements(gl.TRIANGLES, this.gridCount, gl.UNSIGNED_INT, 0);
    }
  }

  bindLine(p, bufA, bufB, bufM) {
    const gl = this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.bCorner);
    gl.enableVertexAttribArray(p.a.aCorner);
    gl.vertexAttribPointer(p.a.aCorner, 2, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(p.a.aCorner, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufA);
    gl.enableVertexAttribArray(p.a.aA);
    gl.vertexAttribPointer(p.a.aA, 2, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(p.a.aA, 1);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufB);
    gl.enableVertexAttribArray(p.a.aB);
    gl.vertexAttribPointer(p.a.aB, 2, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(p.a.aB, 1);
    if (bufM) {
      gl.bindBuffer(gl.ARRAY_BUFFER, bufM);
      gl.enableVertexAttribArray(p.a.aMeta);
      gl.vertexAttribPointer(p.a.aMeta, 3, gl.FLOAT, false, 0, 0);
      gl.vertexAttribDivisor(p.a.aMeta, 1);
    } else {
      gl.disableVertexAttribArray(p.a.aMeta);
      gl.vertexAttrib3f(p.a.aMeta, 0, -1, -1);
    }
  }

  drawLines(set, M, opt) {
    const gl = this.gl, p = this.pLine, L = this.lines[set];
    if (!L.n) return;
    this.setCommon(p, M);
    gl.uniform1f(p.u.uElev, opt.elev);
    gl.uniform1f(p.u.uWidth, opt.width * this.dpr);
    gl.uniform2f(p.u.uRes, this.W, this.H);
    gl.uniform1i(p.u.uMode, opt.mode);
    gl.uniform1f(p.u.uFlow, this.time * 0.35 % 1);
    gl.uniform4fv(p.u.uColor, opt.color);
    this.bindLine(p, L.a, L.b, L.meta);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, L.n);
  }

  drawDyn(M, segs, opt) {
    if (!segs || !segs.length) return;
    const gl = this.gl, p = this.pLine, d = this.dyn;
    const n = Math.min(segs.length, MAX_DYN);
    for (let i = 0; i < n; i++) {
      const s = segs[i];
      d.a[i * 2] = s[0]; d.a[i * 2 + 1] = s[1];
      d.b[i * 2] = s[2]; d.b[i * 2 + 1] = s[3];
      d.meta[i * 3] = s[4]; d.meta[i * 3 + 1] = s[5]; d.meta[i * 3 + 2] = s[6];
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, d.ba); gl.bufferSubData(gl.ARRAY_BUFFER, 0, d.a, 0, n * 2);
    gl.bindBuffer(gl.ARRAY_BUFFER, d.bb); gl.bufferSubData(gl.ARRAY_BUFFER, 0, d.b, 0, n * 2);
    gl.bindBuffer(gl.ARRAY_BUFFER, d.bm); gl.bufferSubData(gl.ARRAY_BUFFER, 0, d.meta, 0, n * 3);
    this.setCommon(p, M);
    gl.uniform1f(p.u.uElev, opt.elev || 0.006);
    gl.uniform1f(p.u.uWidth, opt.width * this.dpr);
    gl.uniform2f(p.u.uRes, this.W, this.H);
    gl.uniform1i(p.u.uMode, opt.mode);
    gl.uniform1f(p.u.uFlow, (this.time * 0.32) % 1);
    gl.uniform4fv(p.u.uColor, opt.color);
    this.bindLine(p, d.ba, d.bb, d.bm);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
  }

  ringSegs(lon, lat, radDeg, elev, dash) {
    const c = v3.fromLL(lon, lat);
    let ref = Math.abs(c[1]) > 0.9 ? [1, 0, 0] : [0, 1, 0];
    let e0 = [ref[1] * c[2] - ref[2] * c[1], ref[2] * c[0] - ref[0] * c[2], ref[0] * c[1] - ref[1] * c[0]];
    const l0 = Math.hypot(e0[0], e0[1], e0[2]) || 1; e0 = e0.map((v) => v / l0);
    const e1 = [c[1] * e0[2] - c[2] * e0[1], c[2] * e0[0] - c[0] * e0[2], c[0] * e0[1] - c[1] * e0[0]];
    const r = radDeg * DEG, ca = Math.cos(r), sa = Math.sin(r);
    const N = 96, out = [];
    let prev = null;
    for (let i = 0; i <= N; i++) {
      const a = i / N * Math.PI * 2;
      const p = v3.toLL([
        c[0] * ca + (e0[0] * Math.cos(a) + e1[0] * Math.sin(a)) * sa,
        c[1] * ca + (e0[1] * Math.cos(a) + e1[1] * Math.sin(a)) * sa,
        c[2] * ca + (e0[2] * Math.cos(a) + e1[2] * Math.sin(a)) * sa]);
      if (prev && Math.abs(prev[0] - p[0]) < 180 && (!dash || (i & 3) < 2)) {
        out.push([prev[0], prev[1], p[0], p[1], elev, elev, i / N]);
      }
      prev = p;
    }
    return out;
  }

  drawLabels(M) {
    if (!this.fx.labels || !this.labelCount) return;
    const gl = this.gl, p = this.pLabel;
    this.setCommon(p, M);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.atlasTex);
    gl.uniform1i(p.u.uAtlas, 0);
    gl.uniform1f(p.u.uPix, LABEL_PX * this.worldPerPixel());
    gl.uniform1f(p.u.uMinArea, Math.max(120, 26000 * this.cam.dist * this.cam.dist * (1 + 0.9 * easeIO(clamp(this.cam.morph, 0, 1)))));
    gl.uniform1f(p.u.uFade, clamp((this.build - 0.55) * 3, 0, 1));
    // cities fade in as a group once the view is roughly "one country" wide,
    // independent of each city's own (fixed, small) label footprint
    const cityFade = this.cam.morph > 0.5
      ? clamp((1.05 - this.cam.dist) / 0.55, 0, 1)
      : clamp((3.0 - this.cam.dist) / 1.0, 0, 1);
    gl.uniform1f(p.u.uCityFade, this.fx.cities === false ? 0 : cityFade);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.bQuad01);
    gl.enableVertexAttribArray(p.a.aCorner);
    gl.vertexAttribPointer(p.a.aCorner, 2, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(p.a.aCorner, 0);
    const bind = (loc, buf, size) => {
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
      gl.vertexAttribDivisor(loc, 1);
    };
    bind(p.a.aLL, this.lbBuf.ll, 2);
    bind(p.a.aUV, this.lbBuf.uv, 4);
    bind(p.a.aInfo, this.lbBuf.info, 4);
    bind(p.a.aTier, this.lbBuf.tier, 1);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, this.labelCount);
    gl.vertexAttribDivisor(p.a.aLL, 0); gl.vertexAttribDivisor(p.a.aUV, 0); gl.vertexAttribDivisor(p.a.aInfo, 0);
  }

  fullscreenPass(p, setup) {
    const gl = this.gl;
    gl.useProgram(p);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.bQuad01);
    gl.enableVertexAttribArray(p.a.aCorner);
    gl.vertexAttribPointer(p.a.aCorner, 2, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(p.a.aCorner, 0);
    setup && setup(p);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  render(now) {
    const gl = this.gl;
    this.time = now / 1000;
    this.sun = sunDirection();
    this.sweep = this.fx.sweep ? ((this.time * 26) % 360) - 180 : 9999;
    // keep procedural cells around 9 CSS px so they never degenerate into static
    this.nightScale = clamp(DEG / (this.worldPerPixel() * 9), 2.5, 90);
    const M = this.matrices();
    this._M = M;
    const morph = easeIO(clamp(this.cam.morph, 0, 1));

    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fboScene.fb);
    gl.viewport(0, 0, this.W, this.H);
    gl.clearColor(0.012, 0.020, 0.040, 1);
    gl.depthMask(true);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    gl.disable(gl.DEPTH_TEST); gl.depthMask(false); gl.disable(gl.BLEND);
    this.fullscreenPass(this.pStars, (p) => {
      gl.uniform3fv(p.u.uFwd, M.fwd); gl.uniform3fv(p.u.uRight, M.right); gl.uniform3fv(p.u.uUp, M.up);
      gl.uniform1f(p.u.uTanHalf, Math.tan(FOV / 2));
      gl.uniform1f(p.u.uAspect, M.aspect);
      gl.uniform1f(p.u.uTime, this.time);
      gl.uniform2f(p.u.uRes, this.W, this.H);
    });

    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true);
    this.drawMesh(this.pOcean, M, 0, false);
    gl.useProgram(this.pLand);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.palTexA);
    gl.uniform1i(this.pLand.u.uPal, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, this.palTexB);
    gl.uniform1i(this.pLand.u.uPalB, 1);
    gl.uniform1f(this.pLand.u.uPalMix, this.palMix);
    gl.uniform1f(this.pLand.u.uHover, this.hover);
    this.drawMesh(this.pLand, M, 0.0016, true);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    const zoomK = clamp((3.4 - this.cam.dist) / 2.2, 0, 1);
    this.drawLines('grat', M, { elev: 0.0008, width: 1.0, mode: 1, color: [0.27, 0.88, 0.72, 0.09] });
    this.drawLines('seg', M, { elev: 0.0034, width: 1.0 + zoomK * 0.8, mode: 0, color: [0.58, 0.95, 0.88, 0.45 + zoomK * 0.30] });
    this.drawLines('dash', M, { elev: 0.0042, width: 1.8, mode: 2, color: [0.96, 0.73, 0.34, 0.8] });
    if (this.sel >= 0) {
      this.drawLines('seg', M, { elev: 0.0054, width: 3.6, mode: 3, color: [0.99, 0.78, 0.38, 0.95] });
    }

    // clouds (shader outputs premultiplied colour)
    if (this.fx.clouds > 0.01 && morph < 0.98) {
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(this.pCloud);
      gl.uniform1f(this.pCloud.u.uCloudAmt, this.fx.clouds * this.build);
      this.drawMesh(this.pCloud, M, 0.014, false);
    }

    // additive layers
    gl.blendFunc(gl.ONE, gl.ONE);
    if (this.fx.aurora > 0.01 && morph < 0.9) {
      gl.useProgram(this.pAurora);
      gl.uniform1f(this.pAurora.u.uAurora, this.fx.aurora * this.build);
      this.drawMesh(this.pAurora, M, 0.035, false);
    }
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    if (this.arcs) this.drawDyn(M, this.arcs, { mode: 4, width: 2.6, color: [0.99, 0.80, 0.42, 0.95] });
    if (this.sel >= 0) {
      const m = this.mesh.meta[this.sel];
      const rr = Math.max(3, m.r / DEG * 1.5);
      const pulse = 1 + 0.045 * Math.sin(this.time * 2.2);
      this.drawDyn(M, this.ringSegs(m.lon, m.lat, rr * pulse, 0.008 + this.selLift, true),
        { mode: 5, width: 1.8, color: [0.99, 0.78, 0.38, 0.55] });
    }
    for (const r of this.ripples) {
      const age = (now - r.t0) / 1100;
      if (age > 1) continue;
      this.drawDyn(M, this.ringSegs(r.lon, r.lat, 2 + age * 26, 0.007, false),
        { mode: 5, width: 2.4 * (1 - age), color: [0.42, 0.98, 0.86, 0.85 * (1 - age)] });
    }
    this.ripples = this.ripples.filter((r) => now - r.t0 < 1100);

    // atmosphere: tight inner rim + wide outer halo
    gl.disable(gl.DEPTH_TEST);
    const atmo = (r, pow, gain) => {
      const pa = this.pAtmo;
      gl.useProgram(pa);
      gl.uniformMatrix4fv(pa.u.uVP, false, M.vp);
      gl.uniform1f(pa.u.uR, r);
      gl.uniform1f(pa.u.uPow, pow);
      gl.uniform1f(pa.u.uGain, gain * this.fx.atmo);
      gl.uniform1f(pa.u.uFade, (1 - morph) * this.build);
      gl.uniform3fv(pa.u.uEye, M.eye);
      gl.uniform3fv(pa.u.uSun, this.sun);
      gl.bindBuffer(gl.ARRAY_BUFFER, this.bGridPos);
      gl.enableVertexAttribArray(pa.a.aLL);
      gl.vertexAttribPointer(pa.a.aLL, 2, gl.FLOAT, false, 0, 0);
      gl.vertexAttribDivisor(pa.a.aLL, 0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.bGridIdx);
      gl.drawElements(gl.TRIANGLES, this.gridCount, gl.UNSIGNED_INT, 0);
    };
    atmo(1.022, 7.0, 1.35);
    atmo(1.16, 3.4, 0.62);

    gl.disable(gl.BLEND);
    this.postProcess(M);
  }

  postProcess() {
    const gl = this.gl;
    let src = this.fboScene.tex;
    for (let i = 0; i < 3; i++) {
      const L = this.blm[i];
      gl.bindFramebuffer(gl.FRAMEBUFFER, L.b.fb);
      gl.viewport(0, 0, L.b.w, L.b.h);
      if (i === 0) {
        this.fullscreenPass(this.pBright, (p) => {
          gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src);
          gl.uniform1i(p.u.uTex, 0); gl.uniform1f(p.u.uThresh, 0.52);
        });
      } else {
        this.fullscreenPass(this.pBlur, (p) => {
          gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src);
          gl.uniform1i(p.u.uTex, 0); gl.uniform2f(p.u.uDir, 1 / L.b.w, 0);
        });
      }
      gl.bindFramebuffer(gl.FRAMEBUFFER, L.a.fb);
      this.fullscreenPass(this.pBlur, (p) => {
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, L.b.tex);
        gl.uniform1i(p.u.uTex, 0); gl.uniform2f(p.u.uDir, 0, 1 / L.b.h);
      });
      if (i === 0) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, L.b.fb);
        this.fullscreenPass(this.pBlur, (p) => {
          gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, L.a.tex);
          gl.uniform1i(p.u.uTex, 0); gl.uniform2f(p.u.uDir, 1 / L.b.w, 0);
        });
        gl.bindFramebuffer(gl.FRAMEBUFFER, L.a.fb);
        this.fullscreenPass(this.pBlur, (p) => {
          gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, L.b.tex);
          gl.uniform1i(p.u.uTex, 0); gl.uniform2f(p.u.uDir, 0, 1 / L.b.h);
        });
      }
      src = L.a.tex;
    }
    // place names go in after the bloom source is captured, so type stays crisp
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fboScene.fb);
    gl.viewport(0, 0, this.W, this.H);
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(false);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    this.drawLabels(this._M);
    gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, this.W, this.H);
    this.fullscreenPass(this.pComp, (p) => {
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.fboScene.tex); gl.uniform1i(p.u.uScene, 0);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, this.blm[0].a.tex); gl.uniform1i(p.u.uB1, 1);
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, this.blm[1].a.tex); gl.uniform1i(p.u.uB2, 2);
      gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, this.blm[2].a.tex); gl.uniform1i(p.u.uB3, 3);
      gl.uniform1f(p.u.uBloomAmt, this.fx.bloom);
      gl.uniform1f(p.u.uTime, this.time);
      gl.uniform1f(p.u.uAber, this.fx.aber);
      gl.uniform1f(p.u.uGrain, this.fx.grain);
      gl.uniform1f(p.u.uScan, this.fx.scan);
      gl.uniform1f(p.u.uFlash, this.flash);
      gl.uniform2f(p.u.uRes, this.W, this.H);
    });
  }

  step(now) {
    const c = this.cam;
    let moving = false;
    if (this.build < 1) {
      if (!this.buildT0) this.buildT0 = now;
      this.build = clamp((now - this.buildT0) / 1600, 0, 1);   // wall-clock, so slow devices still reveal
      moving = true;
    }
    this.flash *= 0.86;
    if (this.ripples.length) moving = true;
    const wantLift = this.sel >= 0 ? 0.022 : 0;
    if (Math.abs(this.selLift - wantLift) > 0.0002) { this.selLift = lerp(this.selLift, wantLift, 0.12); moving = true; }
    if (Math.abs(this.palMix - this.palMixTo) > 0.002) { this.palMix = lerp(this.palMix, this.palMixTo, 0.09); moving = true; }
    if (this.shiftAnim) {
      const a = this.shiftAnim;
      const t = clamp((now - a.t0) / a.ms, 0, 1), e = easeIO(t);
      this.shift.x = lerp(a.fx, a.tx, e); this.shift.y = lerp(a.fy, a.ty, e);
      if (t >= 1) this.shiftAnim = null;
      moving = true;
    }
    if (this.morphAnim) {
      const a = this.morphAnim;
      const t = clamp((now - a.t0) / a.ms, 0, 1);
      c.morph = lerp(a.from, a.to, easeIO(t));
      if (t >= 1) this.morphAnim = null;
      moving = true;
    }
    if (this.anim) {
      const a = this.anim;
      const t = clamp((now - a.t0) / a.ms, 0, 1), e = easeIO(t);
      c.lon = ((a.from.lon + a.dl * e + 540) % 360) - 180;
      c.lat = lerp(a.from.lat, a.to.lat, e);
      c.dist = lerp(a.from.dist, a.to.dist, e);
      if (t >= 1) this.anim = null;
      moving = true;
    } else if (Math.abs(this.vel.lon) > 0.001 || Math.abs(this.vel.lat) > 0.001) {
      c.lon = ((c.lon + this.vel.lon + 540) % 360) - 180;
      c.lat = clamp(c.lat + this.vel.lat, -89, 89);
      this.vel.lon *= 0.94; this.vel.lat *= 0.94;
      moving = true;
    }
    if (this.spin && now > this.spinIdle && !this.anim && c.morph < 0.02) {
      c.lon = ((c.lon + 0.035 + 540) % 360) - 180;
      moving = true;
    }
    return moving;
  }
}

/* ============================================================
   indicator access, ranking, thematic scales, online refresh
   ============================================================ */
const DATA = { countries: [], indMeta: [], orgMeta: [], seriesYears: [], byKey: {}, ranks: {}, wb: null };

function initData(bundle) {
  DATA.countries = bundle.countries;
  DATA.indMeta = bundle.indMeta;
  DATA.orgMeta = bundle.orgMeta;
  DATA.seriesYears = bundle.seriesYears;
  DATA.countries.forEach((c, i) => { DATA.byKey[c.k] = i; });
  loadCache();
  computeRanks();
}

/* value access: online refresh wins over the bundled baseline */
function indVal(rec, key) {
  if (!rec) return null;
  const w = DATA.wb && DATA.wb.v[rec.k];
  if (w && w[key] != null) return w[key];
  if (key === 'pop') return rec.pop;
  if (key === 'area') return rec.area;
  if (key === 'dens') return rec.dens;
  if (key === 'her') return rec.her;
  return rec.ind ? (rec.ind[key] != null ? rec.ind[key] : null) : null;
}
function indYear(rec, key) {
  const w = DATA.wb && DATA.wb.y[rec.k];
  if (w && w[key] != null) return w[key];
  const m = DATA.indMeta.find((x) => x.k === key);
  if (key === 'pop') return rec.popY;
  return m ? m.year : null;
}
function indIsLive(rec, key) {
  const w = DATA.wb && DATA.wb.v[rec.k];
  return !!(w && w[key] != null);
}

/* extra pseudo-indicators that come straight off the record */
const EXTRA_META = [
  { k: 'pop',  zh: '人口',       en: 'Population',  unit: '',   uzh: '人',        fmt: 'big',  good: 0, group: 'soc' },
  { k: 'area', zh: '国土面积',   en: 'Area',        unit: 'km²', uzh: '平方公里', fmt: 'big',  good: 0, group: 'geo' },
  { k: 'dens', zh: '人口密度',   en: 'Density',     unit: '/km²', uzh: '人/平方公里', fmt: 'dec1', good: 0, group: 'soc' },
  { k: 'her',  zh: '世界遗产',   en: 'World Heritage', unit: '', uzh: '项',       fmt: 'int',  good: 1, group: 'cul' },
];
function allMeta() { return EXTRA_META.concat(DATA.indMeta); }
function metaOf(key) { return allMeta().find((m) => m.k === key); }

/* themes offered on the choropleth bar */
const THEMES = ['pop', 'area', 'dens', 'gdp', 'gdpPc', 'growth', 'hdi', 'life', 'medAge', 'fert',
  'urban', 'net', 'milExp', 'milPct', 'milAct', 'co2', 'forest', 'renew', 'infl', 'unemp', 'her'];
const LOG_THEMES = new Set(['pop', 'area', 'gdp', 'gdpPc', 'dens', 'milExp', 'milAct', 'res', 'exp', 'imp', 'her']);

function computeRanks() {
  DATA.ranks = {};
  for (const m of allMeta()) {
    const rows = [];
    for (let i = 0; i < DATA.countries.length; i++) {
      const c = DATA.countries[i];
      if (!c.un && !c.indep) continue;          // rank sovereign states only
      const v = indVal(c, m.k);
      if (v == null) continue;
      rows.push([i, v]);
    }
    rows.sort((a, b) => b[1] - a[1]);
    const r = { order: rows, rank: {}, min: rows.length ? rows[rows.length - 1][1] : 0, max: rows.length ? rows[0][1] : 1 };
    rows.forEach(([i], n) => { r.rank[i] = n + 1; });
    DATA.ranks[m.k] = r;
  }
}

/* quantile shading: skewed distributions (GDP, population) otherwise collapse
   almost every country into one band of the ramp */
function themeScale(key) {
  const r = DATA.ranks[key];
  if (!r || !r.order.length) return null;
  const n = r.order.length;
  const pos = new Map();
  r.order.forEach(([i], k) => pos.set(i, 1 - k / Math.max(1, n - 1)));
  const idx = new Map();
  DATA.countries.forEach((c, i) => idx.set(c.k, i));
  return (rec) => {
    const i = idx.get(rec.k);
    const p = pos.get(i);
    if (p == null) return indVal(rec, key) == null ? null : 0.5;
    return clamp(p, 0, 1);
  };
}

/* ---------------- formatting ---------------- */
function fmtVal(v, m) {
  if (v == null || !isFinite(v)) return '—';
  switch (m && m.fmt) {
    case 'money': {
      if (LANG === 'zh') {
        if (v >= 1000) return (v / 1000).toFixed(2) + ' 万亿美元';
        if (v >= 1) return (v * 10).toFixed(v >= 10 ? 0 : 1) + ' 亿美元';
        return (v * 1000).toFixed(0) + ' 百万美元';
      }
      if (v >= 1000) return '$' + (v / 1000).toFixed(2) + 'T';
      return '$' + (v >= 100 ? v.toFixed(0) : v.toFixed(1)) + 'B';
    }
    case 'big': { const b = fmtBig(v); return b.v + (b.u ? ' ' + b.u : ''); }
    case 'pct0': return v.toFixed(0) + '%';
    case 'pct1': return v.toFixed(1) + '%';
    case 'dec1': return v.toFixed(1);
    case 'dec2': return v.toFixed(2);
    case 'dec3': return v.toFixed(3);
    case 'int': return fmtInt(v);
    default: return fmtInt(v);
  }
}
function unitOf(m) { return m ? (LANG === 'zh' ? (m.uzh || '') : (m.unit || '')) : ''; }
function labelOf(m) { return m ? (LANG === 'zh' ? m.zh : m.en) : ''; }

/* ---------------- online refresh (World Bank) ---------------- */
const WB_MAP = {
  gdp: ['NY.GDP.MKTP.CD', 1e-9], gdpPc: ['NY.GDP.PCAP.CD', 1], growth: ['NY.GDP.MKTP.KD.ZG', 1],
  infl: ['FP.CPI.TOTL.ZG', 1], unemp: ['SL.UEM.TOTL.ZS', 1], milExp: ['MS.MIL.XPND.CD', 1e-9],
  milPct: ['MS.MIL.XPND.GD.ZS', 1], milAct: ['MS.MIL.TOTL.P1', 1e-3], life: ['SP.DYN.LE00.IN', 1],
  urban: ['SP.URB.TOTL.IN.ZS', 1], net: ['IT.NET.USER.ZS', 1], forest: ['AG.LND.FRST.ZS', 1],
  fert: ['SP.DYN.TFRT.IN', 1], lit: ['SE.ADT.LITR.ZS', 1], pop: ['SP.POP.TOTL', 1],
  res: ['FI.RES.TOTL.CD', 1e-9], exp: ['NE.EXP.GNFS.CD', 1e-9], imp: ['NE.IMP.GNFS.CD', 1e-9],
  renew: ['EG.ELC.RNEW.ZS', 1],
};

function loadCache() {
  try {
    const raw = localStorage.getItem('atlas.wb');
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o && o.v && Date.now() - o.t < 90 * 86400000) DATA.wb = o;
  } catch (e) { /* cache is best effort */ }
}
function saveCache() {
  try { localStorage.setItem('atlas.wb', JSON.stringify(DATA.wb)); } catch (e) { /* quota */ }
}

async function refreshOnline(onProgress) {
  const keys = Object.keys(WB_MAP);
  const store = DATA.wb && DATA.wb.v ? DATA.wb : { t: 0, v: {}, y: {} };
  let done = 0, ok = 0;
  for (const k of keys) {
    const [code, mul] = WB_MAP[k];
    try {
      const url = `https://api.worldbank.org/v2/country/all/indicator/${code}?format=json&per_page=400&mrnev=1`;
      const res = await fetch(url, { mode: 'cors' });
      if (!res.ok) throw new Error(res.status);
      const j = await res.json();
      const rows = Array.isArray(j) && j[1] ? j[1] : [];
      for (const row of rows) {
        const iso = row.countryiso3code;
        if (!iso || row.value == null || DATA.byKey[iso] == null) continue;
        (store.v[iso] = store.v[iso] || {})[k] = +(row.value * mul);
        (store.y[iso] = store.y[iso] || {})[k] = +row.date;
      }
      ok++;
    } catch (e) { /* one indicator failing must not stop the rest */ }
    done++;
    onProgress && onProgress(done / keys.length, k);
  }
  if (!ok) return false;
  store.t = Date.now();
  DATA.wb = store;
  saveCache();
  computeRanks();
  return true;
}

const PANEL_TABS = ['overview', 'geography', 'people', 'economy', 'politics', 'military', 'culture', 'envtech', 'sources'];

const UI = {
  sect(host, title) {
    const s = el('div', 'sect');
    s.appendChild(el('h3', null, title));
    host.appendChild(s);
    return s;
  },
  row(s, k, v, note, live) {
    if (v == null || v === '' || v === '—') return null;
    const r = el('div', 'row');
    r.appendChild(el('span', 'k', k));
    const val = el('span', 'v');
    val.textContent = v;
    if (note) val.appendChild(el('em', null, note));
    if (live) { const b = el('i', 'live', '●'); b.title = T('liveTip'); val.appendChild(b); }
    r.appendChild(val); s.appendChild(r);
    return r;
  },
  kpiRow(host, items) {
    const k = el('div', 'kpis');
    for (const it of items) {
      const d = el('div', 'kpi');
      const vv = el('div', 'v');
      vv.appendChild(el('span', 'cnt', it.v));
      if (it.u) vv.appendChild(el('small', null, it.u));
      d.appendChild(vv);
      d.appendChild(el('div', 'l', it.l));
      if (it.r) d.appendChild(el('div', 'rk', '#' + it.r));
      k.appendChild(d);
    }
    host.appendChild(k);
  },
  metric(s, rec, key, i) {
    const m = metaOf(key);
    if (!m) return;
    const v = indVal(rec, key);
    if (v == null) return;
    const rk = DATA.ranks[key] && DATA.ranks[key].rank[i];
    const total = DATA.ranks[key] ? DATA.ranks[key].order.length : 0;
    const r = el('div', 'row metric');
    r.appendChild(el('span', 'k', labelOf(m)));
    const val = el('span', 'v');
    val.appendChild(el('b', null, fmtVal(v, m)));
    const u = unitOf(m);
    if (u && m.fmt !== 'money' && m.fmt !== 'big' && m.fmt.indexOf('pct') < 0) val.appendChild(el('em', null, u));
    const yr = indYear(rec, key);
    if (yr) val.appendChild(el('em', 'yr', String(yr)));
    if (indIsLive(rec, key)) { const b = el('i', 'live', '●'); b.title = T('liveTip'); val.appendChild(b); }
    r.appendChild(val);
    if (rk) {
      const bar = el('div', 'bar');
      const fill = el('i');
      fill.style.width = (100 - (rk - 1) / Math.max(1, total - 1) * 100).toFixed(1) + '%';
      bar.appendChild(fill);
      bar.appendChild(el('span', 'rk', `#${rk}/${total}`));
      r.appendChild(bar);
    }
    s.appendChild(r);
  },
  spark(series, years, w, h) {
    if (!series || series.length < 2) return null;
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('class', 'spark');
    const mn = Math.min(...series), mx = Math.max(...series);
    const sx = (i) => 4 + i / (series.length - 1) * (w - 8);
    const sy = (v) => h - 6 - (v - mn) / ((mx - mn) || 1) * (h - 18);
    let d = '', a = '';
    series.forEach((v, i) => { d += (i ? 'L' : 'M') + sx(i).toFixed(1) + ' ' + sy(v).toFixed(1); });
    a = d + `L${sx(series.length - 1).toFixed(1)} ${h - 2}L${sx(0).toFixed(1)} ${h - 2}Z`;
    const grad = document.createElementNS(ns, 'linearGradient');
    grad.setAttribute('id', 'sg'); grad.setAttribute('x1', '0'); grad.setAttribute('y1', '0');
    grad.setAttribute('x2', '0'); grad.setAttribute('y2', '1');
    for (const [off, col] of [['0%', 'rgba(70,224,184,.42)'], ['100%', 'rgba(70,224,184,0)']]) {
      const st = document.createElementNS(ns, 'stop');
      st.setAttribute('offset', off); st.setAttribute('stop-color', col);
      grad.appendChild(st);
    }
    const defs = document.createElementNS(ns, 'defs'); defs.appendChild(grad); svg.appendChild(defs);
    const area = document.createElementNS(ns, 'path');
    area.setAttribute('d', a); area.setAttribute('fill', 'url(#sg)'); svg.appendChild(area);
    const line = document.createElementNS(ns, 'path');
    line.setAttribute('d', d); line.setAttribute('fill', 'none');
    line.setAttribute('stroke', '#46e0b8'); line.setAttribute('stroke-width', '1.6');
    line.setAttribute('stroke-linejoin', 'round'); svg.appendChild(line);
    const dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', sx(series.length - 1)); dot.setAttribute('cy', sy(series[series.length - 1]));
    dot.setAttribute('r', '2.6'); dot.setAttribute('fill', '#f2b552'); svg.appendChild(dot);
    const wrap = el('div', 'sparkwrap');
    wrap.appendChild(svg);
    const lab = el('div', 'sparklab');
    lab.appendChild(el('span', null, String(years[0])));
    lab.appendChild(el('span', null, String(years[years.length - 1])));
    wrap.appendChild(lab);
    return wrap;
  },
  orgs(host, rec) {
    if (!rec.orgs || !rec.orgs.length) return;
    const box = el('div', 'orgs');
    for (const o of rec.orgs) {
      const m = DATA.orgMeta.find((x) => x.k === o);
      if (!m) continue;
      box.appendChild(el('span', 'org' + (o === 'NUKE' ? ' hot' : ''), LANG === 'zh' ? m.zh : m.en));
    }
    host.appendChild(box);
  },
};

function renderDossier(body, i, tab, onPick, onCity) {
  const c = DATA.countries[i];
  const zh = LANG === 'zh';
  const NA = T('na');
  body.innerHTML = '';

  if (tab === 'overview') {
    const pop = fmtBig(indVal(c, 'pop')), area = fmtBig(c.area);
    const gdp = indVal(c, 'gdp');
    UI.kpiRow(body, [
      { v: pop.v, u: pop.u, l: T('kPop'), r: DATA.ranks.pop.rank[i] },
      { v: area.v, u: (area.u ? area.u + ' ' : '') + 'km²', l: T('kArea'), r: DATA.ranks.area.rank[i] },
      gdp != null
        ? {
          v: zh ? (gdp >= 1000 ? (gdp / 1000).toFixed(2) : (gdp * 10).toFixed(0))
            : (gdp >= 1000 ? (gdp / 1000).toFixed(2) : gdp.toFixed(0)),
          u: zh ? (gdp >= 1000 ? '万亿$' : '亿$') : (gdp >= 1000 ? 'T$' : 'B$'),
          l: 'GDP', r: DATA.ranks.gdp.rank[i],
        }
        : { v: c.dens != null ? fmtInt(c.dens) : '—', u: '', l: T('kDens') },
    ]);
    const s1 = UI.sect(body, T('sectBasic'));
    UI.row(s1, T('kOfficial'), zh ? c.zhO : c.enO);
    UI.row(s1, T('kCapital'), zh ? (c.cap.zh || c.cap.en) : (c.cap.en || c.cap.zh));
    UI.row(s1, T('kRegion'), [zh ? c.reg.zh : c.reg.en, zh ? c.sub.zh : c.sub.en].filter(Boolean).join(' · '));
    UI.row(s1, T('kTz'), c.tz ? 'UTC ' + c.tz : null);
    UI.row(s1, T('kCurrency'), c.cur.map((x) => `${zh && x.zh ? x.zh : x.en}${x.s ? ' ' + x.s : ''} (${x.c})`).join('、') || NA);
    UI.row(s1, T('kLanguage'), c.lang.map((x) => (zh && x.zh ? x.zh : x.en)).join('、') || NA);
    UI.row(s1, T('kCode'), [c.a2, c.k].filter(Boolean).join(' / '));
    UI.row(s1, T('kPhone'), c.idd);
    UI.row(s1, T('kTld'), (c.tld || []).join(' '));
    if (c.parts) UI.row(s1, T('kParts'), c.parts.map((p) => (zh ? p.zh : p.en)).join(' · '));
    if (c.orgs && c.orgs.length) {
      const s2 = UI.sect(body, T('sectOrgs'));
      UI.orgs(s2, c);
    }
    const s3 = UI.sect(body, T('sectNeighbors'));
    const nb = el('div', 'nbrs');
    if (c.borders.length) {
      for (const b of c.borders) {
        const j = DATA.byKey[b];
        if (j == null) continue;
        const chip = el('span', 'nbr', zh ? DATA.countries[j].zh : DATA.countries[j].en);
        chip.onclick = () => onPick(j);
        nb.appendChild(chip);
      }
    } else nb.appendChild(el('span', 'nbr dimchip', T('none')));
    s3.appendChild(nb);
  }

  if (tab === 'geography') {
    const s = UI.sect(body, T('sectGeo'));
    UI.metric(s, c, 'area', i);
    UI.row(s, T('kCoords'), c.ll ? fmtCoord(c.ll[1], c.ll[0]) : NA);
    UI.row(s, T('kCoast'), c.coast != null ? fmtInt(c.coast) + ' km' : NA);
    UI.row(s, T('kElevMax'), c.elevMax != null ? fmtInt(c.elevMax) + ' m' : NA);
    UI.row(s, T('kElevMin'), c.elevMin != null ? fmtInt(c.elevMin) + ' m' : NA);
    UI.row(s, T('kTemp'), c.temp != null ? c.temp.toFixed(1) + ' °C' : NA);
    UI.row(s, T('kLandlocked'), c.landlocked ? T('yes') : T('no'));
    UI.row(s, T('kNeighbors'), String(c.borders.length));
    UI.row(s, T('kTz'), c.tz ? 'UTC ' + c.tz : NA);
    if (c.cities && c.cities.length) {
      const sc = UI.sect(body, T('sectCities'));
      const box = el('div', 'cities');
      for (const city of c.cities) {
        const row = el('div', 'cityrow');
        row.appendChild(el('span', 'cn', zh ? city.zh : city.en));
        row.appendChild(el('span', 'ce', zh ? city.en : city.zh));
        row.appendChild(el('span', 'cp', city.pop ? fmtBig(city.pop).v + fmtBig(city.pop).u : ''));
        row.onclick = () => onCity && onCity(city.lat, city.lon, zh ? city.zh : city.en);
        box.appendChild(row);
      }
      sc.appendChild(box);
    }
    const s2 = UI.sect(body, T('sectEnv'));
    for (const k of ['forest', 'co2', 'renew']) UI.metric(s2, c, k, i);
  }

  if (tab === 'people') {
    const s = UI.sect(body, T('sectPeople'));
    for (const k of ['pop', 'dens', 'medAge', 'fert', 'life', 'urban', 'lit', 'hdi']) UI.metric(s, c, k, i);
    const s2 = UI.sect(body, T('sectSociety'));
    UI.row(s2, T('kReligion'), c.rel || NA);
    UI.row(s2, T('kLanguage'), c.lang.map((x) => (LANG === 'zh' && x.zh ? x.zh : x.en)).join('、') || NA);
    if (c.parts) UI.row(s2, T('kParts'), c.parts.map((p) => `${zh ? p.zh : p.en} ${fmtInt(p.pop)}`).join('　'));
  }

  if (tab === 'economy') {
    const s = UI.sect(body, T('sectEconomy'));
    for (const k of ['gdp', 'gdpPc', 'gdpPpp', 'growth', 'infl', 'unemp']) UI.metric(s, c, k, i);
    if (c.series) {
      const s2 = UI.sect(body, T('sectTrend'));
      const sp = UI.spark(c.series, DATA.seriesYears, 300, 86);
      if (sp) s2.appendChild(sp);
      const first = c.series[0], last = c.series[c.series.length - 1];
      s2.appendChild(el('div', 'note', zh
        ? `${DATA.seriesYears[0]}–${DATA.seriesYears[DATA.seriesYears.length - 1]} 名义 GDP 由 ${fmtVal(first, metaOf('gdp'))} 增至 ${fmtVal(last, metaOf('gdp'))}，累计 ${((last / first - 1) * 100).toFixed(0)}%。`
        : `Nominal GDP grew from ${fmtVal(first, metaOf('gdp'))} to ${fmtVal(last, metaOf('gdp'))} (${((last / first - 1) * 100).toFixed(0)}%).`));
    }
    const s3 = UI.sect(body, T('sectTrade'));
    for (const k of ['exp', 'imp', 'res', 'debt']) UI.metric(s3, c, k, i);
  }

  if (tab === 'politics') {
    const p = c.pol || {};
    const s = UI.sect(body, T('sectPolity'));
    UI.row(s, T('kGov'), p.gov || (c.gov || NA));
    UI.row(s, T('kLegis'), p.legis);
    UI.row(s, T('kAdmin'), p.admin);
    UI.row(s, T('kLaw'), p.law);
    UI.row(s, T('kHos'), p.hos);
    UI.row(s, T('kHog'), p.hog);
    UI.row(s, T('kIndep'), c.indepDate);
    UI.row(s, T('kUN'), c.un ? T('unMember') : T('unNon'));
    const s2 = UI.sect(body, T('sectOrgs'));
    if (c.orgs && c.orgs.length) UI.orgs(s2, c);
    else s2.appendChild(el('div', 'soon', NA));
    body.appendChild(el('div', 'note', T('polNote')));
  }

  if (tab === 'military') {
    const s = UI.sect(body, T('sectMil'));
    for (const k of ['milExp', 'milPct', 'milAct', 'milRes']) UI.metric(s, c, k, i);
    if (!indVal(c, 'milExp') && !indVal(c, 'milAct')) s.appendChild(el('div', 'soon', NA));
    const s2 = UI.sect(body, T('sectNuke'));
    UI.row(s2, T('kNuke'), c.nuke || (c.orgs && c.orgs.indexOf('NUKE') >= 0 ? T('yes') : T('nonNuke')));
    const al = (c.orgs || []).filter((o) => ['NATO', 'SCO', 'CIS'].indexOf(o) >= 0)
      .map((o) => { const m = DATA.orgMeta.find((x) => x.k === o); return m ? (zh ? m.zh : m.en) : o; });
    UI.row(s2, T('kAlliance'), al.length ? al.join('、') : T('none'));
  }

  if (tab === 'culture') {
    const cu = c.cul || {};
    const s = UI.sect(body, T('sectCulture'));
    UI.row(s, T('kAnthem'), cu.anthem);
    UI.row(s, T('kFlower'), cu.flower);
    UI.row(s, T('kAnimal'), cu.animal || c.sym);
    UI.row(s, T('kDish'), cu.dish || c.dish);
    UI.row(s, T('kSport'), cu.sport);
    UI.row(s, T('kFest'), cu.fest);
    UI.row(s, T('kReligion'), c.rel);
    UI.metric(s, c, 'her', i);
    if (!cu.anthem && !c.dish && c.her == null) s.appendChild(el('div', 'soon', NA));
  }

  if (tab === 'envtech') {
    const s = UI.sect(body, T('sectEnv'));
    for (const k of ['co2', 'forest', 'renew']) UI.metric(s, c, k, i);
    const s2 = UI.sect(body, T('sectTech'));
    for (const k of ['net']) UI.metric(s2, c, k, i);
    UI.row(s2, T('kDrive'), c.landlocked == null ? null : null);
    UI.row(s2, T('kTemp'), c.temp != null ? c.temp.toFixed(1) + ' °C' : null);
  }

  if (tab === 'sources') {
    const s = UI.sect(body, T('srcTitle'));
    for (const key of ['srcGeo', 'srcName', 'srcFacts', 'srcInd', 'srcPop']) {
      const r = el('div', 'row');
      r.appendChild(el('span', 'k', '·'));
      r.appendChild(el('span', 'v', T(key)));
      s.appendChild(r);
    }
    const st = el('div', 'sect');
    st.appendChild(el('h3', null, T('liveTitle')));
    const info = el('div', 'note');
    info.textContent = DATA.wb
      ? T('liveOn').replace('%s', new Date(DATA.wb.t).toISOString().slice(0, 10))
      : T('liveOff');
    st.appendChild(info);
    const btn = el('button', 'gbtn', T('liveBtn'));
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = T('liveRun');
      const ok = await refreshOnline((p) => { btn.textContent = T('liveRun') + ' ' + Math.round(p * 100) + '%'; });
      btn.textContent = ok ? T('liveDone') : T('liveFail');
      if (ok) setTimeout(() => window.ATLAS.ui.refreshAll(), 400);
    };
    st.appendChild(btn);
    body.appendChild(st);
    body.appendChild(el('div', 'note', T('srcNote')));
    const vr = el('div', 'note mono', 'BUILD ' + (window.ATLAS ? window.ATLAS.version : ''));
    body.appendChild(vr);
  }
}

const CMP_KEYS = ['pop', 'area', 'gdp', 'gdpPc', 'growth', 'hdi', 'life', 'medAge', 'urban', 'net', 'milExp', 'milPct', 'co2', 'forest'];

function renderCompare(host, ai, bi) {
  const A = DATA.countries[ai], B = DATA.countries[bi];
  const zh = LANG === 'zh';
  host.innerHTML = '';
  const head = el('div', 'cmp-head');
  for (const [rec, cls] of [[A, 'a'], [B, 'b']]) {
    const d = el('div', 'cmp-side ' + cls);
    d.appendChild(el('span', 'fg', rec.flag || '🏳'));
    d.appendChild(el('span', 'nm', zh ? rec.zh : rec.en));
    head.appendChild(d);
  }
  host.appendChild(head);
  for (const k of CMP_KEYS) {
    const m = metaOf(k);
    const va = indVal(A, k), vb = indVal(B, k);
    if (va == null && vb == null) continue;
    const row = el('div', 'cmp-row');
    row.appendChild(el('div', 'cmp-lab', labelOf(m)));
    const bars = el('div', 'cmp-bars');
    const mx = Math.max(Math.abs(va || 0), Math.abs(vb || 0)) || 1;
    for (const [v, cls] of [[va, 'a'], [vb, 'b']]) {
      const line = el('div', 'cmp-line');
      const bar = el('i', cls + ((v || 0) < 0 ? ' neg' : ''));
      bar.style.width = clamp(Math.abs(v || 0) / mx * 100, 0, 100).toFixed(1) + '%';
      line.appendChild(bar);
      line.appendChild(el('span', null, fmtVal(v, m)));
      bars.appendChild(line);
    }
    row.appendChild(bars);
    host.appendChild(row);
  }
}
